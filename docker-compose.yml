version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # full toolchain for development
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    environment:
      - STELLAR_RPC_URL=http://stellar-node:8000
      - STELLAR_NETWORK_PASSPHRASE=Standalone Network ; February 2021
    depends_on:
      stellar-node:
        condition: service_healthy
    command: bash
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_LOGS_REGION:-us-east-1}
        awslogs-group: ${AWS_LOGS_GROUP:-stellar-dev}
        awslogs-stream-prefix: dev
        awslogs-create-group: "true"
        # Retention (>= 30 days) is enforced on the CloudWatch log group;
        # see docs/monitoring.md for the retention policy setup.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://stellar-node:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  artifacts:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # minimal image with WASM artifacts only
    profiles:
      - artifacts

  stellar-node:
    image: stellar/quickstart:latest
    ports:
      - "8001:8000"
    environment:
      - NETWORK=local
    command: --local --enable-soroban-rpc
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_LOGS_REGION:-us-east-1}
        awslogs-group: ${AWS_LOGS_GROUP:-stellar-dev}
        awslogs-stream-prefix: stellar-node
        awslogs-create-group: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rpc-proxy:
    image: nginx:alpine
    depends_on:
      - stellar-node
    ports:
      - "8000:8000"
    volumes:
      - ./docker/rpc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_LOGS_REGION:-us-east-1}
        awslogs-group: ${AWS_LOGS_GROUP:-stellar-dev}
        awslogs-stream-prefix: rpc-proxy
        awslogs-create-group: "true"

  faucet:
    build:
      context: ./backend
    profiles:
      - faucet
    ports:
      - "3001:3001"
    environment:
      FAUCET_ENABLED: "true"
      FAUCET_PORT: "3001"
      FAUCET_ALLOWED_ORIGIN: ${FAUCET_ALLOWED_ORIGIN:-http://localhost:5173}
      FAUCET_TOKEN_CONTRACT_ID: ${FAUCET_TOKEN_CONTRACT_ID:-}
      FAUCET_ADMIN_SECRET_KEY: ${FAUCET_ADMIN_SECRET_KEY:-}
      FAUCET_RPC_URL: https://soroban-testnet.stellar.org
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-1000000000}
      FAUCET_TOKEN_DECIMALS: ${FAUCET_TOKEN_DECIMALS:-7}
      FAUCET_DB_PATH: /data/faucet.sqlite
    volumes:
      - faucet-data:/data
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_LOGS_REGION:-us-east-1}
        awslogs-group: ${AWS_LOGS_GROUP:-stellar-dev}
        awslogs-stream-prefix: faucet
        awslogs-create-group: "true"
        # Retention (>= 30 days) is enforced on the CloudWatch log group;
        # see docs/monitoring.md for the retention policy setup.
    restart: unless-stopped

volumes:
  cargo-cache:
  target-cache:
  faucet-data:
