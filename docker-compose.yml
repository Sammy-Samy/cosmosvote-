version: "3.9"

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder          # full toolchain for development
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    environment:
      - STELLAR_RPC_URL=http://rpc-proxy:8000
      - STELLAR_NETWORK_PASSPHRASE=Standalone Network ; February 2021
    depends_on:
      rpc-proxy:
        condition: service_started
    command: bash
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://rpc-proxy:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - frontend-net
      - backend-net

  artifacts:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime          # minimal image with WASM artifacts only
    profiles:
      - artifacts

  stellar-node:
    image: stellar/quickstart:latest
    ports:
      - "8001:8000"
    environment:
      - NETWORK=local
    command: --local --enable-soroban-rpc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stellar-net

  rpc-proxy:
    image: nginx:alpine
    depends_on:
      - stellar-node
    ports:
      - "8000:8000"
    volumes:
      - ./docker/rpc-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - stellar-net
      - backend-net

  faucet:
    build:
      context: ./backend
    profiles:
      - faucet
    ports:
      - "3001:3001"
    environment:
      FAUCET_ENABLED: "true"
      FAUCET_PORT: "3001"
      FAUCET_ALLOWED_ORIGIN: ${FAUCET_ALLOWED_ORIGIN:-http://localhost:5173}
      FAUCET_TOKEN_CONTRACT_ID: ${FAUCET_TOKEN_CONTRACT_ID:-}
      FAUCET_ADMIN_SECRET_KEY: ${FAUCET_ADMIN_SECRET_KEY:-}
      FAUCET_RPC_URL: http://rpc-proxy:8000
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-1000000000}
      FAUCET_TOKEN_DECIMALS: ${FAUCET_TOKEN_DECIMALS:-7}
      FAUCET_DB_PATH: /data/faucet.sqlite
    volumes:
      - faucet-data:/data
    restart: unless-stopped
    networks:
      - backend-net

volumes:
  cargo-cache:
  target-cache:
  faucet-data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  stellar-net:
    driver: bridge
    internal: true
